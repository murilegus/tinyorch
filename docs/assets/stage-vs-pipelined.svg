<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Stage-at-a-time orchestrators vs tinyorch pipelining</title>
  <desc id="d">Top: a stage-at-a-time orchestrator finishes fetch for all 10,000 URLs, materializes every page, then starts parse; a crash loses the stage. Bottom: tinyorch pipelines items through fetch, parse and LLM classify with bounded buffers, checkpointing each item so a rerun only does the remaining work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="400" rx="14" fill="#ffffff"/>

  <!-- Batch -->
  <text x="40" y="34" font-size="15" font-weight="600" fill="#111827">Stage-at-a-time orchestrators — one stage finishes before the next starts</text>

  <rect x="40" y="56" width="110" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="95" y="79" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">fetch</text>
  <text x="95" y="98" text-anchor="middle" font-size="12" fill="#4b5563">10,000 URLs</text>

  <line x1="150" y1="84" x2="186" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="48" width="300" height="72" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="340" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">10,000 pages materialized</text>
  <text x="340" y="90" text-anchor="middle" font-size="12" fill="#991b1b">in RAM or an object store, parse waits</text>
  <text x="340" y="108" text-anchor="middle" font-size="12" fill="#991b1b">crash at 7,000 → stage restarts from 0</text>

  <line x1="490" y1="84" x2="526" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="56" width="110" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="585" y="79" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">parse</text>
  <text x="585" y="98" text-anchor="middle" font-size="12" fill="#4b5563">not started</text>

  <line x1="40" y1="150" x2="640" y2="150" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Stream -->
  <text x="40" y="184" font-size="15" font-weight="600" fill="#111827">tinyorch — pipelined per item (bounded input, streaming execution)</text>

  <rect x="40" y="206" width="150" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="115" y="229" text-anchor="middle" font-size="14" font-weight="600" fill="#3b0764">fetch</text>
  <text x="115" y="248" text-anchor="middle" font-size="12" fill="#5b21b6">yields each page</text>

  <circle cx="205" cy="234" r="5" fill="#0d9488"/>
  <circle cx="222" cy="234" r="5" fill="#0d9488"/>
  <circle cx="239" cy="234" r="5" fill="#0d9488"/>
  <line x1="248" y1="234" x2="262" y2="234" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="265" y="206" width="150" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="340" y="229" text-anchor="middle" font-size="14" font-weight="600" fill="#3b0764">parse</text>
  <text x="340" y="248" text-anchor="middle" font-size="12" fill="#5b21b6">consumes immediately</text>

  <circle cx="430" cy="234" r="5" fill="#0d9488"/>
  <circle cx="447" cy="234" r="5" fill="#0d9488"/>
  <circle cx="464" cy="234" r="5" fill="#0d9488"/>
  <line x1="473" y1="234" x2="487" y2="234" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="206" width="150" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="565" y="229" text-anchor="middle" font-size="14" font-weight="600" fill="#3b0764">LLM classify</text>
  <text x="565" y="248" text-anchor="middle" font-size="12" fill="#5b21b6">token-bucket rate limit</text>

  <text x="340" y="390" text-anchor="middle" font-size="11" fill="#0f766e">● bounded buffers with backpressure — a slow stage pauses the one before it</text>

  <line x1="115" y1="262" x2="115" y2="306" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="262" x2="340" y2="306" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="565" y1="262" x2="565" y2="306" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="310" width="600" height="60" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="340" y="333" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">Per-item checkpoint (hash of inputs → result)</text>
  <text x="340" y="354" text-anchor="middle" font-size="12" fill="#115e59">crash at 7,000 → rerun does only the remaining 3,000 · RAM stays bounded</text>
</svg>
