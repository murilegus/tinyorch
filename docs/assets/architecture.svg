<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">tinyorch architecture</title>
  <desc id="d">User code calls the stdlib-only core; the core only defines Protocols; adapters implement them with third-party libraries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="470" rx="14" fill="#ffffff"/>

  <!-- User code -->
  <rect x="40" y="30" width="600" height="96" rx="12" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="340" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">User code</text>
  <text x="340" y="82" text-anchor="middle" font-size="13" fill="#374151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">@task  @flow  @resource</text>
  <text x="340" y="104" text-anchor="middle" font-size="13" fill="#4b5563">crawl · parse · LLM classify</text>

  <line x1="340" y1="126" x2="340" y2="160" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Core -->
  <rect x="40" y="164" width="600" height="146" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="340" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#3b0764">Core — stdlib only, zero dependencies</text>
  <text x="180" y="224" text-anchor="middle" font-size="13" fill="#4c1d95">DAG builder</text>
  <text x="340" y="224" text-anchor="middle" font-size="13" fill="#4c1d95">Async runner</text>
  <text x="500" y="224" text-anchor="middle" font-size="13" fill="#4c1d95">Retry / timeout</text>
  <text x="180" y="250" text-anchor="middle" font-size="13" fill="#4c1d95">Per-item checkpoint</text>
  <text x="340" y="250" text-anchor="middle" font-size="13" fill="#4c1d95">Resource injection</text>
  <text x="500" y="250" text-anchor="middle" font-size="13" fill="#4c1d95">Config model</text>
  <text x="340" y="286" text-anchor="middle" font-size="12" font-style="italic" fill="#5b21b6">Defines Protocols only — knows nothing about Mongo, Redis or Playwright</text>

  <line x1="340" y1="310" x2="340" y2="344" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Adapters -->
  <rect x="40" y="348" width="600" height="96" rx="12" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="340" y="376" text-anchor="middle" font-size="15" font-weight="600" fill="#134e4a">Adapters — third-party allowed, optional extras</text>
  <text x="125" y="404" text-anchor="middle" font-size="13" fill="#115e59">sqlite / Mongo state</text>
  <text x="295" y="404" text-anchor="middle" font-size="13" fill="#115e59">Playwright pool</text>
  <text x="440" y="404" text-anchor="middle" font-size="13" fill="#115e59">LLM client</text>
  <text x="565" y="404" text-anchor="middle" font-size="13" fill="#115e59">CLI / FastAPI</text>
  <text x="340" y="428" text-anchor="middle" font-size="12" font-style="italic" fill="#0f766e">Implement the core’s Protocols</text>
</svg>
