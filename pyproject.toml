[project]
name = "tinyorch"
version = "0.0.1"
description = "A tiny, zero-dependency orchestrator for single-node, item-level pipelines."
readme = "README.md"
authors = [{ name = "Murilegus", email = "murilegus@outlook.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[project.urls]
Homepage = "https://github.com/murilegus/tinyorch"
Repository = "https://github.com/murilegus/tinyorch"
Issues = "https://github.com/murilegus/tinyorch/issues"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
failOnWarnings = true

[[tool.basedpyright.executionEnvironments]]
root = "tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=tinyorch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["tinyorch"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "COM812",
  "ISC001",
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)SPDX-FileCopyrightText:\\s+©?\\s*\\d{4}"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "EM", "TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["tinyorch"]
